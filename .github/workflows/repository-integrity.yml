name: Repository integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '26'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate supplied materials and source/configuration syntax
        run: python .github/scripts/check_repository.py

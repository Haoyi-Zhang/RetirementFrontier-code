name: Scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare raw-output directory
        run: mkdir -p "$RUNNER_TEMP/retirementfrontier-scientific"
      - name: Install optional local solver
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 180s \
            python -m pip install --disable-pip-version-check 'z3-solver==4.13.3.0' \
            2>&1 | tee "$RUNNER_TEMP/retirementfrontier-scientific/dependencies.log"
      - name: Run finite scientific checks from the flat artifact root
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 3670016
          ulimit -t 2400
          timeout --signal=TERM --kill-after=15s 2400s bash -c '
            set -euo pipefail
            python -B .github/scripts/check_repository.py 2>&1 | tee "$RUNNER_TEMP/retirementfrontier-scientific/source-integrity.log"
            python -B scripts/check_targeted.py 2>&1 | tee "$RUNNER_TEMP/retirementfrontier-scientific/targeted.log"
            python -B scripts/reproduce_portable.py --require-smt 2>&1 | tee "$RUNNER_TEMP/retirementfrontier-scientific/campaign.log"
            python -B scripts/aggregate.py 2>&1 | tee "$RUNNER_TEMP/retirementfrontier-scientific/aggregate.log"
            python -B scripts/run_posix_smoke.py 2>&1 | tee "$RUNNER_TEMP/retirementfrontier-scientific/posix.log"
            python -B scripts/validate_release.py 2>&1 | tee "$RUNNER_TEMP/retirementfrontier-scientific/validation.log"
          '
      - name: Upload raw outputs even after a failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-outputs
          path: |
            ${{ runner.temp }}/retirementfrontier-scientific/
            results/
          if-no-files-found: error
          retention-days: 14
